server:
  port: ${PORT:8084}

spring:
  application:
    name: ms-notificaciones
  config:
    # Credenciales reales de RabbitMQ y de la BD (NO se sube a GitHub, ver .gitignore)
    import: optional:classpath:application-secrets.properties

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nexora_notificaciones?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
    username: ${DB_USER:nexora}
    password: ${DB_PASS:nexora123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${NEXORA_JWT_ISSUER_URI:https://login.microsoftonline.com/5f26903b-8f3c-4181-afbb-a40c0b6e034d/v2.0}
          audiences: ${NEXORA_JWT_AUDIENCE:967df881-c709-4c72-9c7c-787c1aa5557d,api://967df881-c709-4c72-9c7c-787c1aa5557d}

  rabbitmq:
    # Los dos nodos del clúster: si se pierde la conexión con uno, el cliente se reconecta al otro
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual          # cada consumidor decide ACK / NACK explícitamente
        prefetch: 1                       # un mensaje a la vez por consumidor
        default-requeue-rejected: false   # una excepción no controlada NO reencola: va a la DLQ

# =====================================================================
# Topología RabbitMQ centralizada: TODOS los nombres viven aquí.
# El código los lee desde MessagingProperties o con ${...} en @RabbitListener.
# =====================================================================
nexora:
  messaging:
    exchanges:
      eventos: nexora.eventos.topic          # TOPIC: eventos de dominio (pedido.*, pago.*)
      documentos: nexora.documentos.direct   # DIRECT: comandos de generación de documentos
      dead-letter: nexora.dlx.direct         # DIRECT: Dead Letter Exchange compartido
    retencion-dlq-ms: 86400000               # los mensajes en DLQ se conservan 24 h
    max-mensajes-cola: 10000                 # tope de mensajes por cola principal
    notificaciones:                          # Caso de uso 1: avisar al cliente
      queue: nexora.notificaciones.q
      dlq: nexora.notificaciones.dlq
      dead-letter-routing-key: notificaciones.dead
      binding-keys:
        - "pedido.*"
        - "pago.*"
    boletas:                                 # Caso de uso 2: generar boleta del pago
      queue: nexora.boletas.q
      dlq: nexora.boletas.dlq
      dead-letter-routing-key: boletas.dead
      binding-keys:
        - "boleta.generar"
    dlq-monitor:
      enabled: false                         # true = consumir y registrar en log lo que llega a las DLQ

  notificaciones:
    simular-fallo-correo: false              # true = simula caída del servidor de correo (demo de reintento + DLQ)

logging:
  level:
    cl.duoc.nexoramarket: INFO
