spring.application.name=ms-productos
server.port=${PORT:8081}

spring.config.import=optional:classpath:application-secrets.properties

# Base de datos: local por defecto, en AWS se pasa DB_URL apuntando al RDS
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexora_productos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:nexora}
spring.datasource.password=${DB_PASS:nexora123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Emisor (tenant de Entra ID) y audiencia (Client ID de la API) que debe traer el token
spring.security.oauth2.resourceserver.jwt.issuer-uri=${NEXORA_JWT_ISSUER_URI:https://login.microsoftonline.com/5f26903b-8f3c-4181-afbb-a40c0b6e034d/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${NEXORA_JWT_AUDIENCE:967df881-c709-4c72-9c7c-787c1aa5557d,api://967df881-c709-4c72-9c7c-787c1aa5557d}
