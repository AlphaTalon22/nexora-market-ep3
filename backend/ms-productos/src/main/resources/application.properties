spring.application.name=ms-productos
server.port=${PORT:8081}

spring.config.import=optional:classpath:application-secrets.properties

# Base de datos: local por defecto, en AWS se pasa DB_URL apuntando al RDS
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexora_productos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:nexora}
spring.datasource.password=${DB_PASS:nexora123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Emisor (tenant de Entra ID) y audiencia (Client ID de la API) que debe traer el token
spring.security.oauth2.resourceserver.jwt.issuer-uri=${NEXORA_JWT_ISSUER_URI:https://login.microsoftonline.com/5f26903b-8f3c-4181-afbb-a40c0b6e034d/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${NEXORA_JWT_AUDIENCE:967df881-c709-4c72-9c7c-787c1aa5557d,api://967df881-c709-4c72-9c7c-787c1aa5557d}

# ---------- Kafka ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}

# Productor de InventarioEvento (key = productoId, valor JSON)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# acks=all + idempotencia: el mensaje se confirma cuando lo tienen las réplicas en sync (min.insync=2) y sin duplicados por reintento
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=5
# Si Kafka no responde, no bloquear el hilo más de 5 s
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer productos-stock (lee PedidoEvento de nexora.pedidos.eventos)
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer: un JSON malformado no bloquea la partición y va al DLT
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.duoc.nexoramarket.common.kafka
spring.kafka.consumer.properties.spring.json.use.type.headers=false
