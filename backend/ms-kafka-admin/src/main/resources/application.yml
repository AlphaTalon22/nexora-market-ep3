server:
  port: ${PORT:8086}

spring:
  application:
    name: ms-kafka-admin
  config:
    import: optional:classpath:application-secrets.properties

  # Un solo nombre para todos los servicios (Terraform y user_data de la EC2 lo definen)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${NEXORA_JWT_ISSUER_URI:https://login.microsoftonline.com/5f26903b-8f3c-4181-afbb-a40c0b6e034d/v2.0}
          audiences: ${NEXORA_JWT_AUDIENCE:967df881-c709-4c72-9c7c-787c1aa5557d,api://967df881-c709-4c72-9c7c-787c1aa5557d}

logging:
  level:
    cl.duoc.nexoramarket: INFO
